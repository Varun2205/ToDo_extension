<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
</head>

<body>
  <div class="page">

    <!-- LEFT COLUMN -->
    <section class="left">
      <div class="imgCont">
        <img src="" alt="">
      </div>

      <form class="search-bar"
        action="https://www.google.com/search"
        method="GET">
        <input
          type="text"
          name="q"
          placeholder="Search Google"
          autocomplete="off"
        />
      </form>

      <div class="shortcuts"></div>
    </section>

    <!-- RIGHT COLUMN -->
    <section class="right">
      <div class="todo-app">
        <h1>TO DO</h1>
        <input id="taskInput" type="text" placeholder="New note" />
        <ul id="taskList"></ul>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
