<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="containerL">
      <div class="imgCont">
        <img src="" alt="#">
      </div>
      <form
        class="search-bar"
        action="https://www.google.com/search"
        method="GET"
      >
        <input
          type="text"
          name="q"
          placeholder="Search Google"
          autocomplete="off"
        />
      </form>
      <div class="shortcuts">
        <div class="shortcut gmail"></div>
        <div class="shortcut netflix"></div>
        <div class="shortcut primevideo"></div>
        <div class="shortcut himanime"></div>
        <div class="shortcut amazon"></div>
        <div class="shortcut udemy"></div>
        <div class="shortcut flixhq"></div>
      </div>
    </div>
    <div id="containerR">
      <div class="todo-app">
        <h1>TO DO</h1>
        <input id="taskInput" type="text" placeholder="New note" />
        <ul id="taskList"></ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
